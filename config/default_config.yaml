# kokoro-term configuration

active_character: "roxy"
character_dir: "characters"

llm:
  # Providers: "gemini", "openai", "ollama", "mock"
  provider: "gemini"
  model: "gemini-flash-lite-latest"
  api_key_env: "GEMINI_API_KEY"
  base_url: ""
  temperature: 0.7
  max_tokens: 1024

memory:
  enabled: true
  db_path: "data/memory.db"
  short_term_window: 15
  auto_consolidate_interval: 10
  user_id: "Midhun"

ui:
  theme: "dark"
  show_avatar_panel: true
  mode: "companion"

avatar:
  backend: "terminal"
  enable_animation: true
  fps: 24
  eyebrows: "subtle"
  lipsync_offset_ms: 0

# Voice & TTS Settings
# PRIVACY NOTICE:
# - 'local' provider is 100% private and runs fully on your local machine with 0 network calls.
# - 'edge' provider transmits spoken text to Microsoft's Bing Speech service via an unofficial
#   reverse-engineered endpoint (speech.platform.bing.com). Only conversational text is sent;
#   tool outputs, code, files, memory databases, and screenshots are NEVER transmitted.
voice:
  provider: "local"     # "local" (private offline default) or "edge" (online cloud)
  fallback_enabled: true # Automatically falls back to local if cloud encounters rate-limits or disconnection
  preset: "mature_mommy_fast"
  voice: "en-US-AvaNeural"
  speed: 1.20
  base_pitch: -4
  base_rate: 20
  pause_comma_ms: 120
  pause_sentence_ms: 250
  trim_silence: true
  custom_model_path: ""

music:
  duck: "on"
  duck_volume: 30
  default_volume: 100

tools:
  enabled: true
  auto_approve_moderate: true
  dangerous_actions: "ask"

